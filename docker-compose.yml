
name: northstar-retail

services:

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: northstar-seaweedfs
    command: mini -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    ports:
      - "8333:8333"
    volumes:
      - seaweedfs-data:/data
    networks:
      - northstar-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: northstar-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - northstar-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: northstar-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - northstar-network
    depends_on:
      - prometheus
    restart: unless-stopped

  northstar-metrics:
    image: python:3.12-slim
    container_name: northstar-metrics
    working_dir: /app

    command: >
      sh -c "
      pip install --no-cache-dir prometheus-client pyarrow &&
      python scripts/northstar_metrics.py
      "
    volumes:
      - ./:/app
    ports:
      - "8000:8000"
    networks:
      - northstar-network
    restart: unless-stopped

volumes:
  seaweedfs-data:
  prometheus-data:
  grafana-data:

networks:
  northstar-network:
    driver: bridge