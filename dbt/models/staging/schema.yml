version: 2

models:

  - name: stg_customers
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique

      - name: customer_unique_id
        data_tests:
          - not_null

  - name: stg_sellers
    columns:
      - name: seller_id
        data_tests:
          - not_null
          - unique

  - name: stg_products
    columns:
      - name: product_id
        data_tests:
          - not_null
          - unique

  - name: stg_orders
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique

      - name: customer_id
        data_tests:
          - not_null

  - name: stg_order_items
    columns:
      - name: order_id
        data_tests:
          - not_null

      - name: order_item_id
        data_tests:
          - not_null

      - name: product_id
        data_tests:
          - not_null

      - name: seller_id
        data_tests:
          - not_null

  - name: stg_order_payments
    columns:
      - name: order_id
        data_tests:
          - not_null

      - name: payment_sequential
        data_tests:
          - not_null

  - name: stg_order_events
    columns:
      - name: event_id
        data_tests:
          - not_null
          - unique

      - name: event_type
        data_tests:
          - not_null

      - name: event_timestamp
        data_tests:
          - not_null
          